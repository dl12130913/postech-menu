<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="POSTECH 本周食堂菜单，中韩双语对照，支持按日期、餐厅、午晚餐筛选和菜名搜索。">
  <meta name="theme-color" content="#1f6f50">
  <title>POSTECH 本周食堂 · 中韩双语菜单</title>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./styles.css">
  <script defer src="./menu-data.js"></script>
  <script defer src="./app.js"></script>
</head>
<body>
<main class="wrap">
  <header class="top">
    <div><div class="eyebrow">POSTECH / WEEKLY MENU</div><h1>这周，吃什么？ <span id="week-range"></span></h1><p>POSTECH 食堂 · 韩文原名与中文对照</p></div>
    <div class="src">更新于 <time id="updated"></time><br>来源：PODIUM 식당 안내 · <a href="https://www.instagram.com/p/Dff_F1Dkpm6/" target="_blank" rel="noopener noreferrer">@mealallpostech ↗</a></div>
  </header>
  <p id="notice" class="notice" hidden></p>
  <div class="toolbar" role="search" aria-label="筛选菜单">
    <label class="field search">找一道菜<input id="query" type="search" placeholder="搜索中文或韩文菜名" autocomplete="off"></label>
    <label class="field">餐厅<select id="restaurant"><option value="all">全部餐厅</option></select></label>
    <label class="field">餐次<select id="meal"><option value="all">午餐 + 晚餐</option><option value="lunch">只看午餐</option><option value="dinner">只看晚餐</option></select></label>
    <button type="button" class="utility" id="today">回到今天</button>
    <button type="button" class="utility theme-label" id="theme">主题：系统</button>
    <button type="button" class="utility" id="reset">重置筛选</button>
  </div>
  <nav id="tabs" class="tabs" aria-label="选择日期"></nav>
  <p id="status" class="status" role="status" aria-live="polite" aria-atomic="true"></p>
  <section id="menu" aria-label="菜单结果"></section>
  <noscript><p class="notice">请启用 JavaScript 以查看和筛选菜单。也可以通过上方来源链接查看原始菜单。</p></noscript>
  <p class="foot">只列午餐和晚餐。价格单位：韩元。食堂可能临时换菜，以现场为准。<br>菜名翻译供参考；配料和高汤未逐项核验，饮食限制请向食堂确认。</p>
  <footer><span>为在 POSTECH 的每一天，少纠结一顿饭。</span><a href="https://github.com/dl12130913/postech-menu">GitHub 项目与反馈 ↗</a></footer>
</main>
</body>
</html>
